[project]
name = "evidently-ui"
version = "0.1.0"
requires-python = "==3.10.*"
description = "Résoudre pb de conflit de version. Evidently 0.7.21 avec litestar >= 2.19.0 mais ça bug. Avec des evidently plus ancien, on doit avoir numpy <2.0"
dependencies = [
    "evidently>=0.6.7,<0.7.0",
    "numpy<2.0.0",
    "uvicorn>=0.22.0,<1.0.0",
    "litestar>=2.8.3,<2.10.0",
    "sniffio>=1.3.1",
]
